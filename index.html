<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Presentation Board</title>
  
  <!-- PWA Manifest & Meta Links -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3247/3247414.png">

  <!-- Google Fonts: Bengali Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atma:wght@500;600;700&family=Galada&family=Hind+Siliguri:wght@400;600;700&family=Mina:wght@400;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #8b5cf6;
      --accent: #06b6d4;
      --bg-dark: #070314;
      --panel-bg: #110926;
      --panel-border: #2d1854;
      --neon-purple: #c084fc;
      --neon-cyan: #22d3ee;
      --neon-gold: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Hind Siliguri', sans-serif;
      background: var(--bg-dark);
      color: #fff;
      position: fixed;
    }

    #app-container {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 1. Top Bar */
    #top-bar {
      flex: 0 0 46px;
      height: 46px;
      background: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      border-bottom: 1px solid var(--panel-border);
      z-index: 50;
      box-shadow: 0 2px 12px rgba(139, 92, 246, 0.2);
    }

    .app-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 5px;
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
      white-space: nowrap;
    }

    .top-actions { display: flex; gap: 5px; }

    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .btn-theme { background: #581c87; color: #f3e8ff; border: 1px solid #a855f7; }
    .btn-save { background: #059669; color: #fff; }
    .btn-install { background: #0284c7; color: #fff; display: none; }
    .btn-play-preview { background: #facc15; color: #000; font-weight: 700; }
    .btn-clear { background: #dc2626; color: #fff; }

    /* 2. Slide Navigation Strip */
    #slide-strip {
      flex: 0 0 44px;
      background: #09031a;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      z-index: 45;
    }
    #slide-strip::-webkit-scrollbar { display: none; }

    .slide-chip {
      padding: 5px 12px;
      background: #190e38;
      border: 1px solid #4c1d95;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #c4b5fd;
    }
    .slide-chip.active {
      background: #7c3aed;
      color: #fff;
      border-color: #c084fc;
      box-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
    }

    .btn-add-slide {
      background: #059669;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 3. Canvas Viewport */
    #canvas-viewport {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #060112;
      overflow: hidden;
      touch-action: none;
    }

    /* 16:9 Virtual Board */
    #virtual-board {
      width: 1920px;
      height: 1080px;
      position: absolute;
      transform-origin: center center;
      border-radius: 14px;
      overflow: hidden;
      transition: opacity 0.45s ease-in-out;
      opacity: 1;
    }

    #virtual-board.theme-white {
      background: #ffffff !important;
      color: #0f172a;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    #virtual-board.theme-neon-purple {
      background: radial-gradient(circle at center, #1e0b3d 0%, #0c021f 65%, #05000e 100%) !important;
      border: 4px solid #a855f7;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.5), inset 0 0 60px rgba(34, 211, 238, 0.25) !important;
      color: #ffffff;
    }

    #virtual-board.theme-chalkboard {
      background: #1e3a2f !important;
      background-image: radial-gradient(circle, #2d5a49 10%, #173227 90%) !important;
      color: #f1f5f9;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    /* Board Items (Fully scalable with Pinch) */
    .board-item {
      position: absolute;
      touch-action: none;
      transform-origin: center center;
      display: inline-block;
      cursor: grab;
    }

    .board-item.selected {
      outline: 4px dashed #38bdf8;
      outline-offset: 4px;
      z-index: 999 !important;
    }

    .resize-handle {
      position: absolute;
      width: 48px;
      height: 48px;
      background: #38bdf8;
      border: 3px solid #fff;
      border-radius: 50%;
      bottom: -22px;
      right: -22px;
      cursor: nwse-resize;
      display: none;
      z-index: 1001;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .board-item.selected .resize-handle {
      display: block;
    }

    .step-badge {
      position: absolute;
      top: -24px;
      left: -24px;
      background: #ec4899;
      color: white;
      font-size: 22px;
      font-weight: bold;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.8);
      border: 3px solid #fff;
      pointer-events: none;
      z-index: 1002;
    }

    .item-text {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.35;
      padding: 10px 18px;
      border-radius: 14px;
      display: inline-block;
      text-decoration-thickness: 4px;
      text-underline-offset: 6px;
    }

    .item-image {
      display: block;
      pointer-events: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    .flow-node {
      border-radius: 18px;
      padding: 16px 28px;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 4px solid;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(18, 8, 38, 0.92);
      backdrop-filter: blur(8px);
    }
    .flow-node.root {
      border-color: #38bdf8;
      color: #38bdf8;
      font-size: 46px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }
    .flow-node.branch {
      border-color: #facc15;
      color: #facc15;
      font-size: 38px;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.35);
    }
    .flow-node.subbranch {
      border-color: #ec4899;
      color: #f472b6;
      font-size: 32px;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.35);
    }

    /* 4. Bottom Dock */
    #bottom-dock {
      flex: 0 0 auto;
      max-height: 38vh;
      background: var(--panel-bg);
      border-top: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 6px);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
    }

    .tool-tabs {
      display: flex;
      overflow-x: auto;
      background: #09031a;
      border-bottom: 1px solid var(--panel-border);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
    }
    .tool-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: var(--neon-cyan);
      border-bottom-color: var(--neon-cyan);
      background: rgba(34, 211, 238, 0.1);
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
    }

    .panels-container {
      overflow-y: auto;
      max-height: calc(38vh - 36px);
      -webkit-overflow-scrolling: touch;
    }

    .tab-panel {
      padding: 9px;
      display: none;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tab-panel.active { display: flex; }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-label {
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 500;
    }

    select, input[type="text"] {
      padding: 6px 8px;
      background: #09031a;
      border: 1px solid #4c1d95;
      border-radius: 8px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }

    .btn-action {
      padding: 6px 12px;
      background: #6d28d9;
      color: white;
      border: 1px solid #8b5cf6;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
      font-size: 12px;
    }
    .btn-action:active { transform: scale(0.96); }

    .btn-toggle-active {
      background: #facc15 !important;
      color: #000 !important;
      font-weight: 700;
    }

    .color-swatch-list { display: flex; gap: 5px; align-items: center; }
    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
    }

    /* Floating Item Toolbar */
    #item-quick-toolbar {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 9, 38, 0.95);
      padding: 5px 12px;
      border-radius: 30px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      border: 1px solid #6d28d9;
      z-index: 150;
      overflow-x: auto;
      max-width: 94vw;
    }
    .quick-btn {
      background: none;
      border: none;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: inherit;
      white-space: nowrap;
    }
    .quick-btn.delete { color: #f87171; }

    /* Presentation Overlays */
    #presentation-hud {
      display: none;
      position: absolute;
      top: 18px;
      right: 22px;
      z-index: 2000;
      background: rgba(17, 9, 38, 0.75);
      padding: 6px 14px;
      border-radius: 30px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
      border: 1px solid rgba(139, 92, 246, 0.3);
      backdrop-filter: blur(4px);
    }

    #presentation-tap-area {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1900;
      background: transparent;
      cursor: pointer;
    }

    @media (orientation: landscape) {
      #top-bar, #slide-strip, #bottom-dock, #item-quick-toolbar { display: none !important; }
      #canvas-viewport { padding: 0 !important; background: #000000; }
      #presentation-hud, #presentation-tap-area { display: block; }
      .board-item { cursor: default !important; outline: none !important; }
      .step-badge, .resize-handle { display: none !important; }
    }

    body.presenting-override #top-bar,
    body.presenting-override #slide-strip,
    body.presenting-override #bottom-dock, 
    body.presenting-override #item-quick-toolbar { display: none !important; }
    body.presenting-override #presentation-hud, 
    body.presenting-override #presentation-tap-area { display: block !important; }
    body.presenting-override .step-badge,
    body.presenting-override .resize-handle { display: none !important; }

    #pause-symbol {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 75px;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(0, 0, 0, 0.65);
      width: 125px;
      height: 125px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2100;
      pointer-events: none;
    }

    .anim-pop {
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div id="app-container">
  
  <!-- 1. Top Bar -->
  <div id="top-bar">
    <div class="app-title">
      <span>🏫</span>
      <span>নিওন প্রেজেন্টার</span>
    </div>
    <div class="top-actions">
      <button class="btn-sm btn-install" id="pwa-install-btn" onclick="installPWA()">📲 অ্যাপ ইনস্টল</button>
      <button class="btn-sm btn-theme" onclick="cycleBoardTheme()">🎨 নিওন থিম</button>
      <button class="btn-sm btn-clear" onclick="clearCurrentSlide()">🗑️ সাফ</button>
      <button class="btn-sm btn-save" onclick="saveToStorage()">💾 সেভ</button>
      <button class="btn-sm btn-play-preview" onclick="togglePortraitPresentation()">▶️ প্লে</button>
    </div>
  </div>

  <!-- 2. Slides Bar Strip -->
  <div id="slide-strip">
    <div id="slides-list" style="display:flex; gap:6px;"></div>
    <button class="btn-add-slide" onclick="addNewSlide()">+ নতুন বোর্ড</button>
    <button class="btn-sm" style="background:#4c1d95; color:#fff; border-radius:20px" onclick="duplicateCurrentSlide()">📋 কপি</button>
    <button class="btn-sm" style="background:#7f1d1d; color:#fca5a5; border-radius:20px" onclick="deleteCurrentSlide()">❌ মুছুন</button>
  </div>

  <!-- 3. Canvas Viewport -->
  <div id="canvas-viewport">
    <div id="virtual-board" class="theme-neon-purple"></div>
    <div id="pause-symbol">⏸️</div>
  </div>

  <!-- Floating Selection Toolbar -->
  <div id="item-quick-toolbar">
    <button class="quick-btn" onclick="editSelectedItem()">✏️ এডিট</button>
    <button class="quick-btn" onclick="toggleItemUnderline()"><u>U</u> আন্ডারলাইন</button>
    <button class="quick-btn" onclick="rotateSelectedItem()">🔄 ঘোরান</button>
    <button class="quick-btn" onclick="bringItemForward()">🔝 সামনে</button>
    <button class="quick-btn" onclick="sendItemBackward()">🔙 পেছনে</button>
    <button class="quick-btn" id="voice-btn" onclick="recordAudioForSelected()">🎙️ অডিও</button>
    <button class="quick-btn" onclick="testPlayVoice()">🔊 টেস্ট</button>
    <button class="quick-btn delete" onclick="deleteSelectedItem()">🗑️ ডিলিট</button>
  </div>

  <!-- 4. Bottom Tool Dock -->
  <div id="bottom-dock">
    <div class="tool-tabs">
      <button class="tab-btn active" onclick="switchTab('text-panel')">✍️ নিওন টেক্সট ও আন্ডারলাইন</button>
      <button class="tab-btn" onclick="switchTab('shape-panel')">🔷 জ্যামিতিক আকার (বর্গসহ)</button>
      <button class="tab-btn" onclick="switchTab('flowchart-panel')">🌳 ব্যাকরণ/ফ্লোচার্ট</button>
      <button class="tab-btn" onclick="switchTab('pointer-panel')">🏹 অ্যারো ও পয়েন্টার</button>
      <button class="tab-btn" onclick="switchTab('media-panel')">🖼️ ছবি ও অডিও</button>
      <button class="tab-btn" onclick="switchTab('expert-panel')">🎓 শিক্ষক টুলস ও কুইজ</button>
      <button class="tab-btn" onclick="switchTab('steps-panel')">🔢 স্টেপ ক্রম</button>
    </div>

    <div class="panels-container">
      <!-- Tab 1: Text, Underline & Colors -->
      <div id="text-panel" class="tab-panel active">
        <div class="control-group">
          <input type="text" id="text-input" placeholder="বাংলায় লিখুন..." style="width: 135px;">
          <button class="btn-action" onclick="addTextItem()">+ টেক্সট যোগ</button>
        </div>

        <div class="control-group">
          <!-- Text Underline Feature -->
          <button class="btn-action" id="btn-underline-toggle" onclick="toggleUnderlinePreset()">
            <u>U</u> আন্ডারলাইন রেখা
          </button>
        </div>

        <div class="control-group">
          <span class="control-label">ফন্ট:</span>
          <select id="font-family-select" style="max-width: 125px;">
            <option value="'Hind Siliguri', sans-serif">হিন্দ শিলিগুড়ি</option>
            <option value="'Galada', cursive">গালাদা (আর্ট)</option>
            <option value="'Atma', cursive">আত্মা (বাচ্চাদের)</option>
            <option value="'Tiro Bangla', serif">তিরো বাংলা</option>
            <option value="'Mina', sans-serif">মিনা</option>
          </select>
        </div>

        <div class="control-group">
          <span class="control-label">সাইজ:</span>
          <select id="font-size-select">
            <option value="44">ছোট</option>
            <option value="66" selected>মাঝারি</option>
            <option value="96">বড়</option>
            <option value="130">বিশাল</option>
          </select>
        </div>

        <!-- Poster-like Neon Text Colors -->
        <div class="control-group">
          <span class="control-label">নিওন টেক্সট রং:</span>
          <div class="color-swatch-list">
            <div class="color-swatch" style="background:#facc15; box-shadow:0 0 6px #facc15" title="পোস্টার গোল্ডেন ইয়েলো" onclick="setTextPresetColor('#facc15')"></div>
            <div class="color-swatch" style="background:#22d3ee; box-shadow:0 0 6px #22d3ee" title="নিওন সায়ান ব্লু" onclick="setTextPresetColor('#22d3ee')"></div>
            <div class="color-swatch" style="background:#f43f5e; box-shadow:0 0 6px #f43f5e" title="পোস্টার ভাইব্রেন্ট রেড" onclick="setTextPresetColor('#f43f5e')"></div>
            <div class="color-swatch" style="background:#ffffff; box-shadow:0 0 6px #ffffff" title="উজ্জ্বল সাদা" onclick="setTextPresetColor('#ffffff')"></div>
            <div class="color-swatch" style="background:#4ade80; box-shadow:0 0 6px #4ade80" title="নিওন গ্রিন" onclick="setTextPresetColor('#4ade80')"></div>
            <div class="color-swatch" style="background:#c084fc; box-shadow:0 0 6px #c084fc" title="নিওন পার্পল" onclick="setTextPresetColor('#c084fc')"></div>
          </div>
        </div>

        <!-- Poster-like Text Ribbon / Backgrounds -->
        <div class="control-group">
          <span class="control-label">টেক্সট ব্যাকগ্রাউন্ড:</span>
          <div class="color-swatch-list">
            <div class="color-swatch" style="background:transparent; border:2px dashed #94a3b8" title="স্বচ্ছ" onclick="setTextBgPresetColor('transparent')"></div>
            <div class="color-swatch" style="background:#b91c1c; border-color:#ef4444" title="পোস্টার লাল রিবন" onclick="setTextBgPresetColor('rgba(185, 28, 28, 0.95)')"></div>
            <div class="color-swatch" style="background:#eab308; border-color:#fde047" title="পোস্টার সোনালী রিবন" onclick="setTextBgPresetColor('rgba(234, 179, 8, 0.95)')"></div>
            <div class="color-swatch" style="background:#1e3a8a; border-color:#3b82f6" title="পোস্টার রয়্যাল ব্লু" onclick="setTextBgPresetColor('rgba(30, 58, 138, 0.95)')"></div>
            <div class="color-swatch" style="background:#581c87; border-color:#a855f7" title="নিওন পার্পল রিবন" onclick="setTextBgPresetColor('rgba(88, 28, 135, 0.95)')"></div>

        <button class="btn-action" style="background:#10b981" onclick="addQuestionCard()">❓ প্রশ্ন ও উত্তর কার্ড</button>
        <button class="btn-action" style="background:#8b5cf6" onclick="addFillInBlankCard()">📝 শূন্যস্থান পূরণ</button>

      <!-- Tab 7: Steps -->
      <div id="steps-panel" class="tab-panel">

  <!-- Presentation HUD & Tap Detector -->
  <div id="presentation-hud">
    <span id="hud-status-text">চলছে (থামাতে টাচ করুন)</span>

</div>

<script>
  /* ========================================================
     PWA SERVICE WORKER REGISTRATION & INSTALL LOGIC
     ======================================================== */
  let deferredPrompt = null;
  const pwaInstallBtn = document.getElementById('pwa-install-btn');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('SW Registered:', reg.scope))
        .catch((err) => console.log('SW Registration failed:', err));
    });
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    pwaInstallBtn.style.display = 'flex'; // মোবাইল ব্রাউজারে ইনস্টল বাটন দৃশ্যমান হবে
  });

  function installPWA() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          pwaInstallBtn.style.display = 'none';
        }
        deferredPrompt = null;
      });
    }
  }

  /* ========================================================
     STATE MANAGEMENT
     ======================================================== */
  const NATIVE_WIDTH = 1920;
  const NATIVE_HEIGHT = 1080;
  let canvasScale = 1;

  let currentTheme = 'theme-neon-purple';

  let slides = [
    {
      id: 'slide_1',
      title: 'বোর্ড ১',
      items: []
    }
  ];
  let currentSlideIndex = 0;
  let selectedItemId = null;
  let activeTextPresetColor = '#facc15';
  let activeTextBgColor = 'transparent';
  let isUnderlinePresetActive = false; // আন্ডারলাইন টগল ট্র্যাক

  // Presentation State
  let isPresenting = false;
  let isPaused = false;
  let presSlideIndex = 0;
  let presStepIndex = 0;
  let presentationTimer = null;
  const STEP_DELAY_MS = 2500;

  const viewport = document.getElementById('canvas-viewport');
  const board = document.getElementById('virtual-board');
  const quickToolbar = document.getElementById('item-quick-toolbar');
  const hudStatus = document.getElementById('hud-status-text');
  const pauseSymbol = document.getElementById('pause-symbol');
  const slidesListContainer = document.getElementById('slides-list');

  function getCurrentSlideItems() {
    return slides[currentSlideIndex].items;
  }

  function renderSlidesStrip() {
    slidesListContainer.innerHTML = '';
    slides.forEach((slide, idx) => {
      const chip = document.createElement('div');
      chip.className = 'slide-chip' + (idx === currentSlideIndex ? ' active' : '');
      chip.innerHTML = `<span>📑 ${slide.title} (${slide.items.length})</span>`;
      chip.onclick = () => switchSlide(idx);
      slidesListContainer.appendChild(chip);
    });
  }

  function switchSlide(index) {
    if (index < 0 || index >= slides.length) return;
    currentSlideIndex = index;
    selectItem(null);
    renderCurrentSlideToBoard();
    renderSlidesStrip();
    updateStepsPanel();
  }

  function addNewSlide() {
    const newIndex = slides.length + 1;
    slides.push({
      id: 'slide_' + Date.now(),
      title: 'বোর্ড ' + newIndex,
      items: []
    });
    switchSlide(slides.length - 1);
  }

  function duplicateCurrentSlide() {
    const cur = slides[currentSlideIndex];
    const clonedItems = JSON.parse(JSON.stringify(cur.items)).map(item => {
      item.id = 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      return item;
    });

    slides.push({
      id: 'slide_' + Date.now(),
      title: cur.title + ' (কপি)',
      items: clonedItems
    });
    switchSlide(slides.length - 1);
  }

  function deleteCurrentSlide() {
    if (slides.length <= 1) {
      alert("কমপক্ষে একটি বোর্ড থাকা আবশ্যক!");
      return;
    }
    if (!confirm(`আপনি কি "${slides[currentSlideIndex].title}" বোর্ডটি মুছে ফেলতে চান?`)) return;

    slides.splice(currentSlideIndex, 1);
    if (currentSlideIndex >= slides.length) {
      currentSlideIndex = slides.length - 1;
    }
    switchSlide(currentSlideIndex);
  }

  function renderCurrentSlideToBoard() {
    board.innerHTML = '';
    const items = getCurrentSlideItems();
    items.forEach(item => renderItemOnBoard(item));
  }

  function clearCurrentSlide() {
    if (!confirm("আপনি কি এই বোর্ডের সকল উপাদান মুছে ফেলতে চান?")) return;
    slides[currentSlideIndex].items = [];
    board.innerHTML = '';
    selectItem(null);
    updateStepsPanel();
    renderSlidesStrip();
  }

  function resizeBoard() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    if (vw === 0 || vh === 0) return;
    const scaleX = vw / NATIVE_WIDTH;
    const scaleY = vh / NATIVE_HEIGHT;
    canvasScale = Math.min(scaleX, scaleY) * (window.innerWidth > window.innerHeight ? 1 : 0.96);
    board.style.transform = `scale(${canvasScale})`;
  }

  window.addEventListener('resize', () => {
    resizeBoard();
    checkOrientationPresentation();
  });

  function cycleBoardTheme() {
    board.classList.remove('theme-neon-purple', 'theme-chalkboard', 'theme-white');
    if (currentTheme === 'theme-neon-purple') {
      currentTheme = 'theme-chalkboard';
    } else if (currentTheme === 'theme-chalkboard') {
      currentTheme = 'theme-white';
    } else {
      currentTheme = 'theme-neon-purple';
    }
    board.classList.add(currentTheme);
  }

  /* ========================================================
     AUDIO SYNTHESIS
     ======================================================== */
  let audioCtx = null;
  function playKidChime(toneType = 'standard') {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      if (toneType === 'reward') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
        osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.65);
      } else {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    } catch(e) {}
  }

  function getNextStepOrder() {
    return getCurrentSlideItems().length + 1;
  }

  /* ========================================================
     ELEMENT BUILDERS WITH UNDERLINE SUPPORT
     ======================================================== */
  function toggleUnderlinePreset() {
    isUnderlinePresetActive = !isUnderlinePresetActive;
    const btn = document.getElementById('btn-underline-toggle');
    if (isUnderlinePresetActive) {
      btn.classList.add('btn-toggle-active');
    } else {
      btn.classList.remove('btn-toggle-active');
    }
  }

  function addTextItem() {
    const input = document.getElementById('text-input');
    const text = input.value.trim() || "সুন্দর বাংলা ভাষা";
    const font = document.getElementById('font-family-select').value;
    const size = parseInt(document.getElementById('font-size-select').value, 10);

    const items = getCurrentSlideItems();
    const item = {
      id: 'item_' + Date.now(),
      type: 'text',
      content: text,
      font: font,
      fontSize: size,
      color: activeTextPresetColor,
      bgColor: activeTextBgColor,
      underline: isUnderlinePresetActive, // আন্ডারলাইন স্ট্যাটাস
      x: 400,
      y: 200 + (items.length % 5) * 80,
      width: 'auto',
      height: 'auto',
      scale: 1,
      rotation: 0,
      step: getNextStepOrder(),
      audioData: null
    };

    items.push(item);
    renderItemOnBoard(item);
    input.value = '';
    updateStepsPanel();
    renderSlidesStrip();
    selectItem(item.id);
  }

  function toggleItemUnderline() {
    if (!selectedItemId) return;
    const item = getCurrentSlideItems().find(i => i.id === selectedItemId);
    if (item && item.type === 'text') {
      item.underline = !item.underline;
      const dom = document.getElementById(item.id);
      if (dom) {
        const t = dom.querySelector('.item-text');
        if (t) {
          t.style.textDecoration = item.underline ? 'underline' : 'none';
          t.style.textDecorationColor = item.color;
        }
      }
    }
  }

  function setTextPresetColor(color) {
    activeTextPresetColor = color;
    if (selectedItemId) {
      const item = getCurrentSlideItems().find(i => i.id === selectedItemId);
      if (item && item.type === 'text') {
        item.color = color;
        const dom = document.getElementById(item.id);
        if (dom) {
          const t = dom.querySelector('.item-text');
          if (t) {
            t.style.color = color;
            if (item.underline) t.style.textDecorationColor = color;
          }
        }
      }
    }
  }

  function setTextBgPresetColor(bgColor) {
    activeTextBgColor = bgColor;
    if (selectedItemId) {
      const item = getCurrentSlideItems().find(i => i.id === selectedItemId);
      if (item && item.type === 'text') {
        item.bgColor = bgColor;
        const dom = document.getElementById(item.id);
        if (dom) {
          const t = dom.querySelector('.item-text');
          if (t) t.style.backgroundColor = bgColor;
        }
      }
    }
  }

  function addShapeItem(shapeType) {
    let svgContent = '';
    let w = 260, h = 260;
    let label = '';

    if (shapeType === 'square') {
      w = 260; h = 260;
      label = 'বর্গক্ষেত্র (Square)';
      svgContent = `
        <svg viewBox="0 0 240 240" style="width:100%; height:100%;">
          <rect x="25" y="25" width="190" height="190" rx="12" fill="rgba(192, 132, 252, 0.2)" stroke="#c084fc" stroke-width="10"/>
          <text x="120" y="130" text-anchor="middle" font-size="28" font-weight="bold" fill="#facc15" font-family="'Hind Siliguri'">বর্গাকার (Square)</text>
        </svg>
      `;
    } else if (shapeType === 'triangle') {
      w = 260; h = 240;
      label = 'ত্রিভুজ (Triangle)';
      svgContent = `
        <svg viewBox="0 0 240 220" style="width:100%; height:100%;">
          <polygon points="120,20 25,190 215,190" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="10" stroke-linejoin="round"/>
          <text x="120" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#facc15" font-family="'Hind Siliguri'">ত্রিভুজ</text>
        </svg>
      `;
    } else if (shapeType === 'cone') {
      w = 260; h = 240;
      label = 'সমকোণ (৯০°)';
      svgContent = `
        <svg viewBox="0 0 240 220" style="width:100%; height:100%;">
          <line x1="40" y1="20" x2="40" y2="180" stroke="#22d3ee" stroke-width="12" stroke-linecap="round"/>
          <line x1="40" y1="180" x2="200" y2="180" stroke="#22d3ee" stroke-width="12" stroke-linecap="round"/>
          <rect x="40" y="140" width="40" height="40" fill="none" stroke="#f43f5e" stroke-width="6"/>
          <text x="90" y="130" font-size="28" font-weight="bold" fill="#facc15" font-family="'Hind Siliguri'">৯০°</text>
        </svg>
      `;
    } else if (shapeType === 'round') {
      w = 260; h = 260;
      label = 'বৃত্ত (Circle)';
      svgContent = `
        <svg viewBox="0 0 240 240" style="width:100%; height:100%;">
          <circle cx="120" cy="120" r="95" fill="rgba(34, 211, 238, 0.2)" stroke="#22d3ee" stroke-width="10"/>
          <circle cx="120" cy="120" r="8" fill="#f43f5e"/>
          <line x1="120" y1="120" x2="215" y2="120" stroke="#facc15" stroke-width="5" stroke-dasharray="8,6"/>
          <text x="135" y="110" font-size="22" font-weight="bold" fill="#facc15" font-family="'Hind Siliguri'">ব্যাসার্ধ (r)</text>
        </svg>
      `;
    } else if (shapeType === 'rect_corner') {
      w = 340; h = 220;
      label = 'আয়তক্ষেত্র (Rectangle)';
      svgContent = `
        <svg viewBox="0 0 320 200" style="width:100%; height:100%;">
          <rect x="20" y="20" width="280" height="160" rx="14" fill="rgba(147, 51, 234, 0.2)" stroke="#a855f7" stroke-width="10"/>
          <text x="160" y="115" text-anchor="middle" font-size="26" font-weight="bold" fill="#22d3ee" font-family="'Hind Siliguri'">আয়তাকার বক্স</text>
        </svg>
      `;
    } else if (shapeType === 'ice_cone') {
      w = 240; h = 280;
      label = 'শঙ্কু (Cone)';
      svgContent = `
        <svg viewBox="0 0 240 280" style="width:100%; height:100%;">
          <ellipse cx="120" cy="220" rx="80" ry="28" fill="rgba(250, 204, 21, 0.25)" stroke="#facc15" stroke-width="8"/>
          <line x1="40" y1="220" x2="120" y2="30" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>
          <line x1="200" y1="220" x2="120" y2="30" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>
          <circle cx="120" cy="30" r="8" fill="#f43f5e"/>
          <text x="120" y="270" text-anchor="middle" font-size="24" font-weight="bold" fill="#fde047" font-family="'Hind Siliguri'">শঙ্কু (Cone)</text>
        </svg>
      `;
    } else if (shapeType === 'cylinder') {
      w = 220; h = 290;
      label = 'সিলিন্ডার / চোঙ';
      svgContent = `
        <svg viewBox="0 0 220 280" style="width:100%; height:100%;">
          <ellipse cx="110" cy="50" rx="70" ry="24" fill="rgba(34, 211, 238, 0.25)" stroke="#22d3ee" stroke-width="8"/>
          <line x1="40" y1="50" x2="40" y2="220" stroke="#22d3ee" stroke-width="8"/>
          <line x1="180" y1="50" x2="180" y2="220" stroke="#22d3ee" stroke-width="8"/>
          <ellipse cx="110" cy="220" rx="70" ry="24" fill="rgba(34, 211, 238, 0.25)" stroke="#22d3ee" stroke-width="8"/>
          <text x="110" y="145" text-anchor="middle" font-size="24" font-weight="bold" fill="#38bdf8" font-family="'Hind Siliguri'">চোঙ / বেলন</text>

    const item = {
      id: 'item_' + Date.now(),
      type: 'shape',
      svg: svgContent,
      label: label,
      width: w,
      height: h,
      scale: 1,
      rotation: 0,
      x: 550,
      y: 300,
      step: getNextStepOrder(),
      audioData: null
    };

    getCurrentSlideItems().push(item);
    renderItemOnBoard(item);
    updateStepsPanel();

  function addHighlightBox() {
    const item = {
      id: 'item_' + Date.now(),
      type: 'highlight_box',
      width: 520,
      height: 250,
      scale: 1,
      rotation: 0,
      x: 500,
      y: 300,
      step: getNextStepOrder(),
      audioData: null
    };
    getCurrentSlideItems().push(item);
    renderItemOnBoard(item);
    updateStepsPanel();
    renderSlidesStrip();
    selectItem(item.id);
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const item = {
        id: 'item_' + Date.now(),
        type: 'image',
        src: evt.target.result,
        width: 480,
        height: 340,
        scale: 1,
        rotation: 0,
        x: 450,
        y: 260,
        step: getNextStepOrder(),
        audioData: null
      };
      getCurrentSlideItems().push(item);
      renderItemOnBoard(item);
      updateStepsPanel();
      renderSlidesStrip();
      selectItem(item.id);
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function addArrowItem(arrowType) {
    let svgPath = '';
    let w = 240, h = 90;

    if (arrowType === 'right') {
      svgPath = `<path d="M 20 45 L 180 45 M 145 20 L 185 45 L 145 70" fill="none" stroke="#22d3ee" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />`;
    } else if (arrowType === 'down') {

  function attachUniversalPinchEvents(el, item, resizeHandle) {
    let startX = 0, startY = 0;
    let initialItemX = 0, initialItemY = 0;
    let isDragging = false;
    let initialPinchDistance = null;
    let initialScale = 1;

    el.addEventListener('touchstart', (e) => {
      if (isPresenting) return;
      selectItem(item.id);

      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        initialItemX = item.x;
        initialItemY = item.y;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = item.scale || 1;
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (isPresenting || !selectedItemId || selectedItemId !== item.id) return;

      if (e.touches.length === 1 && isDragging) {
        if (e.cancelable) e.preventDefault();
        const deltaX = (e.touches[0].clientX - startX) / canvasScale;
        const deltaY = (e.touches[0].clientY - startY) / canvasScale;
        item.x = Math.round(initialItemX + deltaX);
        item.y = Math.round(initialItemY + deltaY);
        el.style.left = item.x + 'px';
        el.style.top = item.y + 'px';
      } else if (e.touches.length === 2 && initialPinchDistance) {
        if (e.cancelable) e.preventDefault();
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const pinchRatio = currentDistance / initialPinchDistance;
        let newScale = Math.min(Math.max(initialScale * pinchRatio, 0.3), 5.0);
        item.scale = parseFloat(newScale.toFixed(2));
        el.style.transform = `scale(${item.scale}) rotate(${item.rotation || 0}deg)`;
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
        initialPinchDistance = null;
      }
    });

    el.addEventListener('mousedown', (e) => {
      if (isPresenting || e.target === resizeHandle) return;
      selectItem(item.id);
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      initialItemX = item.x;
      initialItemY = item.y;

      function onMouseMove(ev) {
        if (!isDragging) return;
        const deltaX = (ev.clientX - startX) / canvasScale;
        const deltaY = (ev.clientY - startY) / canvasScale;
        item.x = Math.round(initialItemX + deltaX);
        item.y = Math.round(initialItemY + deltaY);
        el.style.left = item.x + 'px';
        el.style.top = item.y + 'px';
      }

      function onMouseUp() {
        isDragging = false;
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });

    resizeHandle.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      const touch = e.touches[0];
      const startTouchX = touch.clientX;
      const initialS = item.scale || 1;

      function onHandleMove(ev) {
        ev.preventDefault();
        const curX = ev.touches[0].clientX;
        const diff = (curX - startTouchX) / 100;
        let targetScale = Math.min(Math.max(initialS + diff, 0.3), 5.0);
        item.scale = parseFloat(targetScale.toFixed(2));
        el.style.transform = `scale(${item.scale}) rotate(${item.rotation || 0}deg)`;
      }

      function onHandleEnd() {
        window.removeEventListener('touchmove', onHandleMove);
        window.removeEventListener('touchend', onHandleEnd);
      }

      window.addEventListener('touchmove', onHandleMove, { passive: false });
      window.addEventListener('touchend', onHandleEnd);
    });
  }

  function rotateSelectedItem() {
    if (!selectedItemId) return;
    const item = getCurrentSlideItems().find(i => i.id === selectedItemId);
    if (!item) return;
    item.rotation = ((item.rotation || 0) + 15) % 360;
    const el = document.getElementById(item.id);
    if (el) el.style.transform = `scale(${item.scale || 1}) rotate(${item.rotation}deg)`;
  }

  function deleteSelectedItem() {
    if (!selectedItemId) return;
    const items = getCurrentSlideItems();
    const idx = items.findIndex(i => i.id === selectedItemId);
    if (idx !== -1) {
      items.splice(idx, 1);
    }
    const el = document.getElementById(selectedItemId);
    if (el) el.remove();
    selectItem(null);
    normalizeStepsOrder();
    updateStepsPanel();
    renderSlidesStrip();
  }

  function bringItemForward() {
    if (!selectedItemId) return;
    const el = document.getElementById(selectedItemId);
    if (el) board.appendChild(el);
  }

  function sendItemBackward() {
    if (!selectedItemId) return;
    const el = document.getElementById(selectedItemId);
    if (el && board.firstChild) board.insertBefore(el, board.firstChild);
  }

    const item = getCurrentSlideItems().find(i => i.id === selectedItemId);
    if (!item) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("মাইক পারমিশন ব্রাউজারে সাপোর্ট করছে না।");
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      
      const vBtn = document.getElementById('voice-btn');
      vBtn.innerHTML = '⏹️ থামান';

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onloadend = () => {
          item.audioData = reader.result;
          alert("ভয়েস সফলভাবে যুক্ত হয়েছে!");
          vBtn.innerHTML = '🎙️ অডিও দেওয়া আছে';
        };
        reader.readAsDataURL(audioBlob);
        stream.getTracks().forEach(track => track.stop());
      };

      vBtn.onclick = () => {
        mediaRecorder.stop();
        vBtn.innerHTML = '🎙️ অডিও';
        vBtn.onclick = recordAudioForSelected;
      };

      mediaRecorder.start();
    } catch(err) {
      alert("মাইক অনুমতি দিন।");
    }
  }

  function testPlayVoice() {
    if (!selectedItemId) return;
    const item = getCurrentSlideItems().find(i => i.id === selectedItemId);
    if (item && item.audioData) {
      new Audio(item.audioData).play();
    } else {
      alert("এই উপাদানে কোনো অডিও যুক্ত নেই।");
    }
  }

  function handleAudioUpload(e) {
    if (!selectedItemId) {
      alert("প্রথমে একটি উপাদান সিলেক্ট করুন।");
      return;
    }
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const item = getCurrentSlideItems().find(i => i.id === selectedItemId);
      if (item) {
        item.audioData = evt.target.result;
        alert("অডিও ফাইল যুক্ত হয়েছে!");
      }
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function normalizeStepsOrder() {
    const items = getCurrentSlideItems();
    items.forEach((item, idx) => {
      item.step = idx + 1;
      const b = document.getElementById('badge_' + item.id);
      if (b) b.innerText = item.step;
    });
  }

  function updateStepsPanel() {
    const cont = document.getElementById('steps-chip-container');
    cont.innerHTML = '';
    const items = getCurrentSlideItems();
    items.forEach((item) => {
      const chip = document.createElement('div');
      chip.style.cssText = `padding: 5px 10px; background: #190e38; border:1px solid #4c1d95; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; color:#c4b5fd;`;
      let label = item.type === 'text' ? item.content.slice(0, 10) + '...' : (item.label || item.title || item.type);
      chip.innerHTML = `<strong>#${item.step}</strong> ${label}`;
      chip.onclick = () => selectItem(item.id);
      cont.appendChild(chip);
    });
  }

  /* ========================================================
     PRESENTATION ENGINE (SEAMLESS MULTI-SLIDE RUNNER)
     ======================================================== */
  function checkOrientationPresentation() {
    const isLandscape = window.innerWidth > window.innerHeight;
    if (isLandscape && !isPresenting) {
      startPresentation();
    } else if (!isLandscape && isPresenting && !document.body.classList.contains('presenting-override')) {
      stopPresentation();
    }
  }

  function togglePortraitPresentation() {
    if (isPresenting) {
      document.body.classList.remove('presenting-override');
      stopPresentation();
    } else {
      document.body.classList.add('presenting-override');
      startPresentation();
    }
  }

  function startPresentation() {
    const hasItems = slides.some(s => s.items.length > 0);
    if (!hasItems) {
      alert("বোর্ডে প্রথমে কিছু উপাদান যোগ করুন!");
      return;
    }

    isPresenting = true;
    isPaused = false;
    presSlideIndex = 0;
    presStepIndex = 0;
    selectItem(null);

    loadSlideForPresentation(presSlideIndex, false);
  }

  function loadSlideForPresentation(sIndex, useFade = true) {
    if (sIndex >= slides.length) {
      hudStatus.innerText = '🎉 সম্পূর্ণ প্রেজেন্টেশন সমাপ্ত!';
      return;
    }

    presSlideIndex = sIndex;
    presStepIndex = 0;

    const setupNewSlide = () => {
      board.innerHTML = '';
      const items = slides[presSlideIndex].items;
      items.forEach(item => {
        renderItemOnBoard(item);
        const el = document.getElementById(item.id);
        if (el) {
          el.style.display = 'none';
          el.classList.remove('anim-pop');
        }
      });

      hudStatus.innerText = 'চলছে (থামাতে টাচ করুন)';
      pauseSymbol.style.display = 'none';
      board.style.opacity = '1';

      clearTimeout(presentationTimer);
      presentationTimer = setTimeout(playNextStep, 500);
    };

    if (useFade) {
      board.style.opacity = '0';
      setTimeout(() => {
        setupNewSlide();
      }, 450);
    } else {
      board.style.opacity = '1';
      setupNewSlide();
    }
  }

  function playNextStep() {
    if (!isPresenting || isPaused) return;

    const currentSlide = slides[presSlideIndex];
    const items = currentSlide.items;

    if (presStepIndex < items.length) {
      const item = items[presStepIndex];
      const el = document.getElementById(item.id);

      if (el) {
        el.style.display = 'inline-block';
        el.classList.add('anim-pop');

        if (item.type === 'expert_reward') {
          playKidChime('reward');
        } else {
          playKidChime('standard');
        }

        if (item.audioData) {
          new Audio(item.audioData).play().catch(()=>{});
        }
      }

      presStepIndex++;
      presentationTimer = setTimeout(playNextStep, STEP_DELAY_MS);
    } else {
      if (presSlideIndex + 1 < slides.length) {
        presentationTimer = setTimeout(() => {
          loadSlideForPresentation(presSlideIndex + 1, true);
        }, 1200);
      } else {
        hudStatus.innerText = '🎉 সম্পূর্ণ প্রেজেন্টেশন সমাপ্ত!';
      }
    }
  }

  function handlePresentationTap() {
    if (!isPresenting) return;

    isPaused = !isPaused;
    if (isPaused) {
      clearTimeout(presentationTimer);
      hudStatus.innerText = '⏸️ থেমে আছে (চালু করতে টাচ করুন)';
      pauseSymbol.style.display = 'flex';
    } else {
      hudStatus.innerText = 'চলছে (থামাতে টাচ করুন)';
      pauseSymbol.style.display = 'none';
      playNextStep();
    }
  }

  function stopPresentation() {
    isPresenting = false;
    isPaused = false;
    clearTimeout(presentationTimer);
    pauseSymbol.style.display = 'none';
    board.style.opacity = '1';

    switchSlide(currentSlideIndex);
  }

  /* ========================================================
     STORAGE & INITIALIZATION
     ======================================================== */
  function saveToStorage() {
    localStorage.setItem('school_neon_multislide_data', JSON.stringify(slides));
    alert("আপনার সকল স্লাইড ও ডায়াগ্রাম ডিভাইসে সেভ হয়েছে!");
  }

  function loadFromStorage() {
    const raw = localStorage.getItem('school_neon_multislide_data');
    if (raw) {
      try {
        const loaded = JSON.parse(raw);
        if (Array.isArray(loaded) && loaded.length > 0) {
          slides = loaded;
          currentSlideIndex = 0;
        }
      } catch(e) {}
    }
    renderSlidesStrip();
    renderCurrentSlideToBoard();
    updateStepsPanel();
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

    event.currentTarget.classList.add('active');
    const panel = document.getElementById(tabId);
    if (panel) panel.classList.add('active');
  }

  window.addEventListener('DOMContentLoaded', () => {
    resizeBoard();
    loadFromStorage();
    checkOrientationPresentation();
  });
</script>
</body>
